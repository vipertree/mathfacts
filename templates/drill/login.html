{% extends 'drill/base.html' %}
{% block title %}Log in · Math Facts{% endblock %}
{% block content %}
<div class="card login-card">
  <h1>🔢 Math Facts</h1>
  {% if form.errors %}<p class="error">That username and password didn't match. Try again!</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="id_username">Username</label>
    <input type="text" name="username" id="id_username" autofocus autocapitalize="none" autocomplete="username">
    <label for="id_password">Password</label>
    <input type="password" name="password" id="id_password" autocomplete="current-password">
    <button type="submit" class="btn-primary">Let's go!</button>
    <input type="hidden" name="next" value="{{ next }}">
  </form>
</div>
{% endblock %}
