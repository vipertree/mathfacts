{% extends 'drill/base.html' %}
{% block title %}Change password · Math Facts{% endblock %}
{% block content %}
<div class="card login-card">
  <h1>Change password</h1>
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}
    {% endfor %}
    <button type="submit" class="btn-primary">Save new password</button>
  </form>
</div>
{% endblock %}
